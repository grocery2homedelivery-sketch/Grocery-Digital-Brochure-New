<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery2Home Interactive Booklet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        .book-container {
            position: relative;
            width: 90vw;
            max-width: 500px;
            height: 75vw;
            max-height: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            object-fit: contain;
            transition: opacity 0.5s ease-in-out;
        }
        .page.active {
            display: block;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background-color: #ffcc00;
            border: none;
            color: #000;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e6b800;
        }
        .page-indicator {
            font-size: 16px;
            font-weight: bold;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div class="book-container" id="bookContainer">
        <!-- Change the extensions (.png, .jpg, .jpeg) below to match what each file actually is -->
        <img src="page1.png" class="page active" alt="Page 1">
        <img src="page2.png" class="page" alt="Page 2">
        <img src="page3.png" class="page" alt="Page 3">
        <img src="page4.png" class="page" alt="Page 4">
        <img src="page5.png" class="page" alt="Page 5">
        <img src="page6.png" class="page" alt="Page 6">
        <img src="page7.png" class="page" alt="Page 7">
        <img src="page8.png" class="page" alt="Page 8">
        <img src="page9.png" class="page" alt="Page 9">
        <img src="page10.png" class="page" alt="Page 10">
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="changePage(-1)">Previous</button>
        <span class="page-indicator" id="pageIndicator">Page 1 of 10</span>
        <button id="nextBtn" onclick="changePage(1)">Next</button>
    </div>

    <script>
        let currentIndex = 0;
        const pages = document.querySelectorAll('.page');
        const indicator = document.getElementById('pageIndicator');

        function updateBook() {
            pages.forEach((page, index) => {
                page.classList.remove('active');
                if (index === currentIndex) {
                    page.classList.add('active');
                }
            });
            indicator.textContent = `Page ${currentIndex + 1} of ${pages.length}`;
        }

        function changePage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = pages.length - 1;
            } else if (currentIndex >= pages.length) {
                currentIndex = 0;
            }
            updateBook();
        }

        // Swipe support for mobile devices
        let touchStartX = 0;
        let touchEndX = 0;

        const container = document.getElementById('bookContainer');

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });

        container.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                changePage(1); // Swipe Left -> Next Page
            }
            if (touchEndX > touchStartX + 50) {
                changePage(-1); // Swipe Right -> Previous Page
            }
        }
    </script>

</body>
</html>
